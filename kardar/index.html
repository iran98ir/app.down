<script>
  /* آیکون */
  (function(){
    var img = document.getElementById('appIcon');
    var box = document.getElementById('iconBox');
    var candidates = ['icon.png','icon.jpeg','icon.jpg','icon.webp','icon.svg','logo.png','logo.jpeg','logo.jpg','logo.webp','logo.svg','app.png','app.jpeg','app.jpg','app-icon.png','app-icon.jpeg','images.png','images.jpeg','images.jpg','image.png','image.jpeg','image.jpg'];
    var i = 0;
    function showFallback(){
      img.style.display = 'none';
      if (box.querySelector('.fallback')) return;
      var fb = document.createElement('div');
      fb.className = 'fallback'; fb.textContent = 'ک'; box.appendChild(fb);
    }
    img.onerror = function(){ i++; if (i < candidates.length) img.src = candidates[i]; else showFallback(); };
    img.onload = function(){ var fb = box.querySelector('.fallback'); if (fb) fb.remove(); img.style.display = 'block'; };
    img.src = candidates[0];
  })();

  /* لینک دانلود: خودش اسم آخرین APK رو پیدا می‌کنه */
  (function(){
    var OWNER = 'iran98ir', REPO = 'app.down';
    var btn = document.getElementById('dlBtn');
    var small = btn.querySelector('small');
    var vTag = document.getElementById('vTag');
    var mVer = document.getElementById('mVer');

    function setInfo(name, size){
      var m = name.match(/(\d+\.\d+(?:\.\d+)?)/);
      var ver = m ? m[1] : 'جدید';
      if (vTag) vTag.textContent = ver;
      if (mVer) mVer.textContent = ver;
      if (small && size) small.textContent = 'نسخه ' + ver + ' · حجم ' + size + ' · رایگان';
    }

    // اول از GitHub API لیست فایل‌های آخرین Release رو بگیر
    fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/releases/latest', {
      headers: { 'Accept': 'application/vnd.github+json' }
    })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(rel){
      var apk = (rel.assets || []).filter(function(a){ return /\.apk$/i.test(a.name); })[0];
      if (!apk) throw new Error('no apk');
      btn.href = apk.browser_download_url;
      btn.setAttribute('download', apk.name);
      setInfo(apk.name, (apk.size/1024/1024).toFixed(1) + ' مگابایت');
    })
    .catch(function(){
      // اگه API جواب نداد (محدودیت)، از لینک latest استفاده کن و اسم فایل رو از URL صفحه Release دربیار
      // اینجا فقط دکمه رو به صفحه آخرین Release وصل می‌کنیم که کاربر خودش دانلود کنه
      btn.href = 'https://github.com/' + OWNER + '/' + REPO + '/releases/latest';
      if (small) small.textContent = 'مشاهده صفحه دانلود';
    });
  })();
        </script>
