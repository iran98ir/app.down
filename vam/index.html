<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وام — دانلود</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }

  body {
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fafbfc;
    color: #0f172a;
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px 16px;
    position: relative;
    overflow-x:hidden;
    overscroll-behavior-y: auto;
    -webkit-font-smoothing: antialiased;
  }

  /* هاله سبز ملایم پشت صفحه */
  body::before {
    content:'';
    position:fixed;
    width:600px; height:600px; border-radius:50%;
    background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 65%);
    top:-200px; right:-200px;
    filter: blur(60px);
    z-index:0; pointer-events:none;
  }
  body::after {
    content:'';
    position:fixed;
    width:500px; height:500px; border-radius:50%;
    background: radial-gradient(circle, rgba(59,130,246,0.08), transparent 65%);
    bottom:-180px; left:-180px;
    filter: blur(60px);
    z-index:0; pointer-events:none;
  }

  .wrap {
    position:relative; z-index:1;
    width:100%; max-width:440px;
    animation: rise 0.8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* ================= هدر مینیمال ================= */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 4px 20px;
    margin-bottom: 8px;
  }
  .topbar .mark {
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:700;
    color:#64748b;
    letter-spacing:0.3px;
  }
  .topbar .mark .dot {
    width:7px; height:7px; border-radius:50%;
    background:#10b981;
    box-shadow:0 0 0 3px rgba(16,185,129,0.15);
  }

  /* ================= هیرو ================= */
  .hero {
    display:flex; align-items:center; gap:18px;
    margin-bottom: 28px;
  }
  .hero .icon-box {
    flex-shrink: 0;
    width:88px; height:88px;
    border-radius:22px;
    background:#fff;
    border:1px solid #e2e8f0;
    box-shadow:
      0 8px 24px -8px rgba(15,23,42,0.12),
      0 2px 6px -2px rgba(15,23,42,0.06);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .hero .icon-box img {
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .hero .meta { flex:1; min-width:0; }
  .hero .eyebrow {
    font-size:11.5px; font-weight:700;
    color:#10b981;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:5px;
  }
  .hero h1 {
    font-size:32px; font-weight:800;
    color:#0f172a;
    letter-spacing:-0.8px;
    line-height:1.15;
    margin-bottom:6px;
  }
  .hero .tagline {
    font-size:13.5px; color:#64748b;
    font-weight:500;
    line-height:1.5;
  }

  /* ================= دکمه دانلود اصلی ================= */
  .download {
    display:flex; align-items:center; justify-content:space-between;
    width:100%;
    padding:18px 22px;
    background:#0f172a;
    color:#ffffff;
    text-decoration:none;
    border-radius:16px;
    font-size:16px; font-weight:700;
    letter-spacing:0.1px;
    box-shadow:
      0 14px 32px -10px rgba(15,23,42,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.2s cubic-bezier(.2,.7,.2,1), box-shadow 0.2s;
    margin-bottom: 14px;
  }
  .download:hover {
    transform:translateY(-1px);
    box-shadow: 0 18px 40px -12px rgba(15,23,42,0.45);
  }
  .download:active { transform:translateY(0); }
  .download .right {
    display:flex; align-items:center; gap:12px;
  }
  .download .dl-icon {
    width:36px; height:36px; border-radius:10px;
    background: rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center;
  }
  .download .dl-icon svg { width:17px; height:17px; }
  .download .arrow {
    font-size:18px; opacity:0.5;
    transition: transform 0.2s;
  }
  .download:hover .arrow { transform:translateX(-3px); opacity:0.8; }

  /* ================= ردیف اطلاعات ================= */
  .info-row {
    display:flex;
    gap:0;
    background:#ffffff;
    border:1px solid #e2e8f0;
    border-radius:14px;
    overflow:hidden;
    margin-bottom: 26px;
  }
  .info-item {
    flex:1;
    padding: 14px 10px;
    text-align:center;
    border-left: 1px solid #f1f5f9;
  }
  .info-item:last-child { border-left: 0; }
  .info-item .label {
    font-size:10.5px; color:#94a3b8;
    font-weight:600; letter-spacing:0.3px;
    margin-bottom:5px;
    text-transform:uppercase;
  }
  .info-item .value {
    font-size:15px; font-weight:800;
    color:#0f172a;
    letter-spacing:-0.2px;
  }

  /* ستاره‌ها — یک ردیف افقی کوچک زیر امتیاز */
  .stars {
    display:flex; justify-content:center; gap:1px;
    font-size: 13px;
    margin-bottom:3px;
    direction: ltr;
    color:#e2e8f0;
  }
  .stars .on { color:#f59e0b; }

  /* ================= نوار امنیت ================= */
  .secure {
    display:flex; align-items:center; gap:12px;
    padding: 16px 18px;
    background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
    border: 1px solid #d1fae5;
    border-radius: 14px;
    margin-bottom: 22px;
  }
  .secure .shield {
    flex-shrink:0;
    width: 34px; height:34px;
    border-radius: 10px;
    background: #10b981;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px -4px rgba(16,185,129,0.5);
  }
  .secure .shield svg { width:17px; height:17px; }
  .secure .text h3 {
    font-size:13px; font-weight:800;
    color:#065f46;
    margin-bottom:3px;
  }
  .secure .text p {
    font-size:11.5px; color:#047857;
    line-height:1.6; font-weight:500;
  }

  /* ================= فوتر ================= */
  .footer {
    text-align:center;
    padding-top: 18px;
    border-top: 1px solid #f1f5f9;
  }
  .footer .verified {
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700;
    color:#64748b;
    letter-spacing:0.2px;
  }
  .footer .verified .check {
    width:14px; height:14px; border-radius:50%;
    background:#10b981;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:9px; font-weight:900;
  }

  @media (max-height:660px) {
    .hero { gap:14px; margin-bottom:20px; }
    .hero .icon-box { width:74px; height:74px; border-radius:18px; }
    .hero h1 { font-size:26px; }
    .hero .tagline { font-size:12.5px; }
    .download { padding:15px 18px; font-size:15px; }
    .info-item { padding:11px 8px; }
    .secure { padding:13px 15px; margin-bottom:16px; }
    .footer { padding-top:14px; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <!-- هدر مینیمال -->
    <div class="topbar">
      <div class="mark">
        <span class="dot"></span>
        دانلود اپلیکیشن
      </div>
    </div>

    <!-- هیرو -->
    <div class="hero">
      <div class="icon-box">
        <img id="appIcon" alt="وام">
      </div>
      <div class="meta">
        <div class="eyebrow">اپلیکیشن رسمی</div>
        <h1>وام</h1>
        <p class="tagline">دسترسی سریع و امن به خدمات وام</p>
      </div>
    </div>

    <!-- دکمه دانلود -->
    <a href="https://github.com/iran98ir/app.down/releases/download/vam/app.apk" class="download">
      <span>دانلود برای اندروید</span>
      <span class="right">
        <span class="dl-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </span>
        <span class="arrow">←</span>
      </span>
    </a>

    <!-- ردیف اطلاعات -->
    <div class="info-row">
      <div class="info-item">
        <div class="label">امتیاز</div>
        <div class="stars"><span class="on">★★★★</span>★</div>
        <div class="value" style="font-size:11px; color:#64748b; font-weight:600;">از ۵</div>
      </div>
      <div class="info-item">
        <div class="label">حجم</div>
        <div class="value">سبک</div>
      </div>
      <div class="info-item">
        <div class="label">نسخه</div>
        <div class="value">1.14.3</div>
      </div>
    </div>

    <!-- نوار امنیت -->
    <div class="secure">
      <div class="shield">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div class="text">
        <h3>امنیت و حریم خصوصی تضمین‌شده</h3>
        <p>بدون هیچ‌گونه دسترسی به مخاطبین، گالری، دوربین یا موقعیت مکانی شما.</p>
      </div>
    </div>

    <!-- فوتر -->
    <div class="footer">
      <div class="verified">
        <span class="check">✓</span>
        تایید شده توسط رایان اپ
      </div>
    </div>

  </div>

  <script>
    (function(){
      var candidates = [
        'icon.png','icon.jpeg','icon.jpg','icon.webp','icon.gif','icon.svg',
        'logo.png','logo.jpeg','logo.jpg','logo.webp','logo.svg',
        'app.png','app.jpeg','app.jpg','app-icon.png','app-icon.jpeg',
        'images.png','images.jpeg','images.jpg','images (2).png','images (2).jpeg',
        'image.png','image.jpeg','image.jpg'
      ];
      var img = document.getElementById('appIcon');
      var i = 0;
      img.onerror = function(){
        i++;
        if (i < candidates.length) {
          img.src = candidates[i];
        } else {
          img.style.display = 'none';
          img.parentNode.style.background = 'linear-gradient(135deg,#10b981,#065f46)';
        }
      };
      img.src = candidates[0];
    })();
  </script>
</body>
</html>
